<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let day = "Monday"
        switch(day){
            case "Monday":
            console.log("Today is Monday");
            break;
             case "Tuesday":
            console.log("Today is Tuesday");
            break;
              case "Wednesday":
            console.log("Today is Wednesday");
            break;  
            case "Thursday":
            console.log("Today is Thursday");
            break; 
             case "Friday":
            console.log("Today is Friday");
            break;
            default:
                console.log("Invalid day");
        }

        let num1 =20;
        let num2 =10;
        let operator ="+"

        switch(operator){
            case "+":
            console.log(num1 + num2);
            break;
                case "-":
            console.log(num1 - num2);
            break;
                case "*":
            console.log(num1 * num2);
            break;
                case "/":
            console.log(num1 / num2);
            break;
            default:
                console.log("Not a number")
        }

        let role = "Student"
        switch(role){
            case "Admin":
                console.log("Welcome admin, You have full access");
                break;
                 case "Teacher":
                console.log("Welcome, You can manage student");
                break;
                 case "Student":
                console.log("Welcome, You can view your courses");
                break;
                 case "Guest":
                console.log("Welcome, You have limited access");
                break;
                default:
                    console.log("Unknown user role")
                
        }


    </script>
</body>
</html>
