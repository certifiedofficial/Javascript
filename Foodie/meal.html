<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Meal Details</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">


<style>

/* =========================
   MODAL
========================= */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.7);

    justify-content: center;
    align-items: center;

    z-index: 9999;
}


/* =========================
   MODAL CONTENT
========================= */

.modal-content {

    position: relative;

    width: 90%;

    max-width: 420px;

    background: white;

    padding: 40px 30px;

    border-radius: 18px;

    text-align: center;

    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);

    animation: modalPop 0.3s ease;
}


/* =========================
   MODAL ANIMATION
========================= */

@keyframes modalPop {

    from {

        opacity: 0;

        transform: scale(0.8);

    }

    to {

        opacity: 1;

        transform: scale(1);

    }

}


/* =========================
   SUCCESS ICON
========================= */

.success-icon {

    width: 70px;

    height: 70px;

    margin: 0 auto 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: black;

    color: white;

    border-radius: 50%;

    font-size: 36px;

    font-weight: bold;
}


/* =========================
   MODAL HEADING
========================= */

.modal-content h2 {

    margin-bottom: 12px;

    font-family: "Poppins", sans-serif;

    font-size: 24px;
}


/* =========================
   MODAL TEXT
========================= */

.modal-content p {

    margin-bottom: 25px;

    color: #666;

    font-family: "Inter", sans-serif;

    line-height: 1.6;
}


/* =========================
   MODAL BUTTON
========================= */

#modal-button {

    width: 100%;

    padding: 13px 20px;

    border: none;

    border-radius: 8px;

    background: black;

    color: white;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;
}

#modal-button:hover {

    opacity: 0.8;

}


/* =========================
   CLOSE BUTTON
========================= */

.close-modal {

    position: absolute;

    top: 10px;

    right: 17px;

    border: none;

    background: none;

    font-size: 30px;

    color: #555;

    cursor: pointer;
}

.close-modal:hover {

    color: black;

}

</style>

</head>


<body>


<div class="details-container">


    <!-- BACK BUTTON -->

    <a href="index.html" class="back">
        ← Back to Menu
    </a>


    <!-- MEAL DETAILS -->

    <div id="meal-details"></div>


    <!-- RELATED MEALS -->

    <section>

        <h2>You May Also Like</h2>

        <div id="related-grid" class="meal-grid"></div>

    </section>


</div>



<!-- =========================
     MODAL
========================= -->

<div class="modal" id="meal-modal">

    <div class="modal-content">


        <!-- CLOSE BUTTON -->

        <button
            class="close-modal"
            id="close-modal">

            &times;

        </button>


        <!-- SUCCESS ICON -->

        <div class="success-icon">

            ✓

        </div>


        <!-- MESSAGE -->

        <h2 id="modal-title">

            Added Successfully!

        </h2>


        <p id="modal-message">

            Your meal has been added to your cart.

        </p>


        <!-- MODAL BUTTON -->

        <button id="modal-button">

            View Cart

        </button>


    </div>

</div>



<script src="meal.js"></script>


<script>

/* =========================
   MODAL ELEMENTS
========================= */

const mealModal =
document.getElementById("meal-modal");

const closeModal =
document.getElementById("close-modal");

const modalButton =
document.getElementById("modal-button");


/* =========================
   CLOSE MODAL
========================= */

closeModal.onclick = () => {

    mealModal.style.display = "none";

};


/* =========================
   CLOSE OUTSIDE MODAL
========================= */

mealModal.onclick = (event) => {

    if (event.target === mealModal) {

        mealModal.style.display = "none";

    }

};


/* =========================
   VIEW CART
========================= */

modalButton.onclick = () => {

    location.href = "cart.html";

};


/* =========================
   OPEN MODAL FUNCTION
========================= */

function showMealModal(title, message) {

    document.getElementById("modal-title").textContent =
    title;

    document.getElementById("modal-message").textContent =
    message;

    mealModal.style.display = "flex";

}

</script>


</body>
</html>
