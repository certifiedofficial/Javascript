<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================
           GENERAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                rgba(15, 23, 42, 0.95),
                rgba(30, 41, 59, 0.9)
            );

            color: white;

            padding: 40px 20px;
        }


        /* =========================
           CHECKOUT PAGE
        ========================= */

        .checkout-page {
            width: 100%;
            max-width: 900px;

            margin: auto;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back {
            display: inline-block;

            margin-bottom: 25px;

            color: #fbbf24;

            text-decoration: none;

            font-weight: 600;

            transition: 0.3s;
        }

        .back:hover {
            transform: translateX(-5px);
        }


        /* =========================
           TITLE
        ========================= */

        .checkout-page h1 {
            font-size: 36px;

            margin-bottom: 30px;
        }


        /* =========================
           ORDER ITEMS
        ========================= */

        #order-list {
            margin-bottom: 25px;
        }

        .cart-item {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding: 20px 25px;

            margin-bottom: 15px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(15px);

            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 18px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.25);

            transition: 0.3s ease;
        }

        .cart-item:hover {

            transform: translateY(-4px);

            border-color:
                rgba(251, 191, 36, 0.5);
        }


        /* =========================
           FOOD INFORMATION
        ========================= */

        .item-info h3 {

            font-size: 18px;

            margin-bottom: 5px;
        }

        .item-info small {

            font-family: "Inter", sans-serif;

            color: #d1d5db;

            font-size: 14px;
        }


        /* =========================
           ITEM PRICE
        ========================= */

        .item-price {

            font-size: 17px;

            font-weight: 600;

            color: #fbbf24;
        }


        /* =========================
           PRICE SUMMARY
        ========================= */

        .price-summary {

            margin-top: 30px;

            padding: 25px;

            background:
                rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(15px);

            -webkit-backdrop-filter: blur(15px);

            border:
                1px solid rgba(255, 255, 255, 0.15);

            border-radius: 18px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.25);
        }


        .price-summary p,
        .price-summary h2 {

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .price-summary p {

            font-family: "Inter", sans-serif;

            color: #d1d5db;

            margin-bottom: 15px;
        }


        .price-summary h2 {

            margin-top: 20px;

            padding-top: 20px;

            border-top:
                1px solid rgba(255, 255, 255, 0.15);

            font-size: 24px;
        }


        #grand-total {

            color: #fbbf24;
        }


        /* =========================
           PLACE ORDER BUTTON
        ========================= */

        .checkout {

            width: 100%;

            margin-top: 20px;

            padding: 15px 30px;

            border: none;

            border-radius: 10px;

            background: #fbbf24;

            color: #111827;

            font-family: "Poppins", sans-serif;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s ease;
        }


        .checkout:hover {

            background: #f59e0b;

            transform: translateY(-2px);
        }


        /* =========================
           EMPTY ORDER
        ========================= */

        .empty-order {

            padding: 50px 20px;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(15px);

            border:
                1px solid rgba(255, 255, 255, 0.15);

            border-radius: 18px;
        }


        .empty-order h2 {

            margin-bottom: 10px;
        }


        .empty-order p {

            color: #d1d5db;

            margin-bottom: 20px;
        }


        /* =========================
           MODAL
        ========================= */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.75);

            backdrop-filter: blur(5px);

            justify-content: center;

            align-items: center;

            padding: 20px;

            z-index: 9999;
        }


        /* =========================
           MODAL CONTENT
        ========================= */

        .modal-content {

            position: relative;

            width: 100%;

            max-width: 420px;

            padding: 40px 30px;

            background:
                rgba(30, 41, 59, 0.96);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            border:
                1px solid rgba(255, 255, 255, 0.15);

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.4);

            animation:
                modalPop 0.3s ease;
        }


        /* =========================
           MODAL ANIMATION
        ========================= */

        @keyframes modalPop {

            from {

                opacity: 0;

                transform: scale(0.8);
            }

            to {

                opacity: 1;

                transform: scale(1);
            }
        }


        /* =========================
           SUCCESS ICON
        ========================= */

        .success-icon {

            width: 75px;

            height: 75px;

            margin: 0 auto 20px;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #fbbf24;

            color: #111827;

            border-radius: 50%;

            font-size: 36px;

            font-weight: bold;

            box-shadow:
                0 5px 20px rgba(251, 191, 36, 0.25);
        }


        /* =========================
           MODAL TEXT
        ========================= */

        .modal-content h2 {

            margin-bottom: 12px;

            font-size: 24px;

            color: white;
        }


        .modal-content p {

            margin-bottom: 25px;

            font-family: "Inter", sans-serif;

            color: #d1d5db;

            line-height: 1.6;
        }


        /* =========================
           CONTINUE SHOPPING BUTTON
        ========================= */

        #continue-shopping {

            width: 100%;

            padding: 13px 20px;

            border: none;

            border-radius: 10px;

            background: #fbbf24;

            color: #111827;

            font-family: "Poppins", sans-serif;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;
        }


        #continue-shopping:hover {

            background: #f59e0b;

            transform: translateY(-2px);
        }


        /* =========================
           CLOSE MODAL
        ========================= */

        .close-modal {

            position: absolute;

            top: 10px;

            right: 17px;

            border: none;

            background: none;

            font-size: 30px;

            color: #d1d5db;

            cursor: pointer;

            transition: 0.3s;
        }


        .close-modal:hover {

            color: #fbbf24;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {

                padding: 25px 15px;
            }


            .checkout-page h1 {

                font-size: 28px;
            }


            .cart-item {

                padding: 17px;

                align-items: flex-start;
            }


            .item-info h3 {

                font-size: 16px;
            }


            .item-price {

                font-size: 15px;
            }


            .price-summary {

                padding: 20px;
            }


            .price-summary h2 {

                font-size: 20px;
            }


            .modal-content {

                padding: 40px 20px 25px;
            }


            .modal-content h2 {

                font-size: 21px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         CHECKOUT PAGE
    ========================== -->

    <div class="checkout-page">


        <a href="cart.html" class="back">

            ← Back to Cart

        </a>


        <h1>Checkout</h1>


        <!-- ORDER ITEMS -->

        <div id="order-list"></div>


        <!-- PRICE SUMMARY -->

        <div class="price-summary">

            <p>

                <span>
                    Food Total
                </span>

                <span id="food-total">
                    ₦0
                </span>

            </p>


            <p>

                <span>
                    Delivery Fee
                </span>

                <span>
                    ₦500
                </span>

            </p>


            <h2>

                <span>
                    Total
                </span>

                <span id="grand-total">
                    ₦0
                </span>

            </h2>

        </div>


        <!-- PLACE ORDER -->

        <button
            id="place-order"
            class="checkout"
        >

            Place Order

        </button>


    </div>



    <!-- =========================
         SUCCESS MODAL
    ========================== -->

    <div
        class="modal"
        id="order-modal"
    >


        <div class="modal-content">


            <!-- CLOSE BUTTON -->

            <button
                class="close-modal"
                id="close-modal"
            >

                &times;

            </button>



            <!-- SUCCESS ICON -->

            <div class="success-icon">

                ✓

            </div>



            <!-- SUCCESS MESSAGE -->

            <h2>

                Order Placed Successfully!

            </h2>


            <p>

                Your order has been received successfully.

                Thank you for ordering with us!

            </p>

            <button id="continue-shopping">

                Continue Shopping

            </button>


        </div>

    </div>



    <script>

        const order =

            JSON.parse(
                localStorage.getItem("checkout")
            )

            ||

            JSON.parse(
                localStorage.getItem("cart")
            )

            ||

            [];

        const orderList =
            document.getElementById(
                "order-list"
            );


        const foodTotal =
            document.getElementById(
                "food-total"
            );


        const grandTotal =
            document.getElementById(
                "grand-total"
            );


        const placeOrder =
            document.getElementById(
                "place-order"
            );


        const orderModal =
            document.getElementById(
                "order-modal"
            );


        const closeModal =
            document.getElementById(
                "close-modal"
            );


        const continueShopping =
            document.getElementById(
                "continue-shopping"
            );

        const deliveryFee = 500;

        let total = 0;


        if (order.length === 0) {


            orderList.innerHTML = `

                <div class="empty-order">

                    <h2>
                        No items to checkout
                    </h2>

                    <p>
                        Add some meals to your cart first.
                    </p>

                    <a href="index.html">

                        <button class="checkout">

                            Browse Meals

                        </button>

                    </a>

                </div>

            `;


            foodTotal.textContent =
                "₦0";


            grandTotal.textContent =
                "₦0";


            placeOrder.style.display =
                "none";


        } else {


            order.forEach(item => {


                const price =

                    Number(
                        item.promo_price ||
                        item.price
                    );


                const quantity =

                    Number(
                        item.quantity
                    ) || 1;


                const itemTotal =

                    price * quantity;


                total += itemTotal;


                orderList.innerHTML += `

                    <div class="cart-item">


                        <div class="item-info">

                            <h3>
                                ${item.name}
                            </h3>

                            <small>

                                ${quantity}
                                ×
                                ₦${price.toLocaleString()}

                            </small>

                        </div>


                        <div class="item-price">

                            ₦${itemTotal.toLocaleString()}

                        </div>


                    </div>

                `;


            });

            foodTotal.textContent =

                "₦" +
                total.toLocaleString();


            grandTotal.textContent =

                "₦" +
                (
                    total +
                    deliveryFee
                ).toLocaleString();

        }

        placeOrder.onclick = () => {


            if (order.length === 0) {

                return;

            }

            localStorage.removeItem(
                "cart"
            );


            localStorage.removeItem(
                "checkout"
            );

            orderModal.style.display =
                "flex";

        };

        closeModal.onclick = () => {


            orderModal.style.display =
                "none";

        };

        continueShopping.onclick = () => {


            orderModal.style.display =
                "none";


            window.location.href =
                "index.html";

        };

        orderModal.onclick = (event) => {


            if (
                event.target ===
                orderModal
            ) {

                orderModal.style.display =
                    "none";

            }

        };

    </script>
</body>
</html>
