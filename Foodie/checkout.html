<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   CHECKOUT MODAL
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);

    justify-content: center;
    align-items: center;

    z-index: 9999;
}

.modal-content {
    position: relative;

    width: 90%;
    max-width: 420px;

    background: white;

    padding: 40px 30px;

    border-radius: 18px;

    text-align: center;

    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);

    animation: modalPop 0.3s ease;
}

@keyframes modalPop {

    from {
        opacity: 0;
        transform: scale(0.8);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}


/* Success Icon */

.success-icon {

    width: 70px;
    height: 70px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: black;
    color: white;

    border-radius: 50%;

    font-size: 36px;
    font-weight: bold;
}


/* Modal Heading */

.modal-content h2 {
    margin-bottom: 12px;

    font-family: "Poppins", sans-serif;

    font-size: 24px;
}


/* Modal Text */

.modal-content p {

    margin-bottom: 25px;

    color: #666;

    font-family: "Inter", sans-serif;

    line-height: 1.6;
}


/* Continue Button */

#continue-shopping {

    width: 100%;

    padding: 13px 20px;

    border: none;

    border-radius: 8px;

    background: black;

    color: white;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;
}

#continue-shopping:hover {
    opacity: 0.8;
}


/* Close Button */

.close-modal {

    position: absolute;

    top: 10px;
    right: 17px;

    border: none;

    background: none;

    font-size: 30px;

    color: #555;

    cursor: pointer;
}

.close-modal:hover {
    color: black;
}

</style>

</head>

<body>


<div class="checkout-page">

    <h1>Checkout</h1>

    <div id="order-list"></div>

    <h2>
        Total:
        <span id="grand-total">₦0</span>
    </h2>

    <button id="place-order" class="checkout">
        Place Order
    </button>

</div>


<!-- =========================
     CHECKOUT SUCCESS MODAL
========================= -->

<div class="modal" id="order-modal">

    <div class="modal-content">

        <!-- Close Button -->

        <button class="close-modal" id="close-modal">
            &times;
        </button>


        <!-- Success Icon -->

        <div class="success-icon">
            ✓
        </div>


        <!-- Message -->

        <h2>
            Order Placed Successfully!
        </h2>

        <p>
            🎉 Your order has been received successfully.
            Thank you for shopping with us!
        </p>


        <!-- Continue Shopping -->

        <button id="continue-shopping">
            Continue Shopping
        </button>

    </div>

</div>


<script>


/* =========================
   GET ORDER
========================= */

const order =
JSON.parse(localStorage.getItem("checkout"))
||
JSON.parse(localStorage.getItem("cart"))
||
[];


/* =========================
   ORDER LIST
========================= */

const orderList =
document.getElementById("order-list");

let total = 0;


order.forEach(item => {

    const price =
    item.promo_price || item.price;

    total += price * item.quantity;

    orderList.innerHTML += `
        <div class="cart-item">

            <p>${item.name}</p>

            <small>
                ${item.quantity} × ₦${price}
            </small>

        </div>
    `;

});


/* =========================
   TOTAL
========================= */

document.getElementById("grand-total").textContent =
"₦" + (total + 500);


/* =========================
   MODAL ELEMENTS
========================= */

const placeOrder =
document.getElementById("place-order");

const orderModal =
document.getElementById("order-modal");

const closeModal =
document.getElementById("close-modal");

const continueShopping =
document.getElementById("continue-shopping");


/* =========================
   PLACE ORDER
========================= */

placeOrder.onclick = () => {

    /* Remove cart */

    localStorage.removeItem("cart");

    localStorage.removeItem("checkout");


    /* Show Modal */

    orderModal.style.display = "flex";

};


/* =========================
   CLOSE MODAL
========================= */

closeModal.onclick = () => {

    orderModal.style.display = "none";

};


/* =========================
   CONTINUE SHOPPING
========================= */

continueShopping.onclick = () => {

    orderModal.style.display = "none";

    location.href = "index.html";

};


/* =========================
   CLOSE WHEN CLICKING
   OUTSIDE MODAL
========================= */

orderModal.onclick = (event) => {

    if (event.target === orderModal) {

        orderModal.style.display = "none";

    }

};

</script>

</body>
</html>
