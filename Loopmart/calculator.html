<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
 <style>
        body{
            background-color: #f2f2f2;
            align-items: center;
            justify-content: center;
            height: 100vh;
            display: flex;
        }
        .calculator{
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        input{
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-row{
            display: flex;
            gap: 10px;
        }
        button{
            flex: 1;
            padding: 12px;
            margin-top: 10px;
            border: none;border-radius: 8px;
            cursor: pointer;
            background-color: #4caf50;
            color: white;
        }
        button:hover{
            opacity: 0.9;
        }
        #clear{
            background:#f44336;
        }
        #result{
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
<body>
    <div class="calculator">
        <h2>This is a simple calculator</h2>
        <input type="number" id="number1" placeholder="Enter the first number">
        <input type="number" id="number2" placeholder="Enter the second numnber">
        <div class="btn-row">
            <button onclick="calculate('add')">Add</button>
            <button onclick="calculate('subtract')">Subtract</button>
            <button onclick="calculate('division')">Division</button>
        </div>
        <div class="btn-row">
            <button onclick="calculate('multiply')">Multiply</button>
            <button onclick="clearFields()" id="clear">Clear</button>
        </div>
        <p id="result"></p>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
