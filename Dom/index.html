<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="card" id="profileCard">
            <img src="bridging-technology-and-human-needs.jpg" alt="Profile Picture" id="profileImage">
            <h2 id="userName">John Doe</h2>
            <p id="description">I am a web developer learning javascript</p>
            <div class="buttons">
            <button id="changeName">Change Name</button>
            <button id="changeDescription">Change Description</button>
            <button id="changeImage">Change Image</button>
            <button id="toggleTheme">Toggle Theme</button>
            <button id="toggleDescription">Toggle Description</button>
            <button id="resetButton">Reset</button>
            </div>
        </div>
    </div>
    <div class="pen">Hello</div>
    <script src="script.js"></script>
</body>
</html>
