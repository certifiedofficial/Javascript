<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism</title>
</head>
<style>
    body{
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-image: url(glassmorphism\ bg.png);
        background-repeat: no-repeat;
        background-position: center center;
        background-attachment: fixed;
        background-size: cover;
    }
    .glass-card{
        width: 400px;
        height: 450px;
        padding: 80px;
        border-radius: 16px;
        color: #fff;
        background-color: rgba(255, 255, 254, 0.15);
        backdrop-filter: blur(7px);
        border: 2px solid rgba(255, 255, 254, 0.15);
    }
    .arrow{
        display: flex;
        width: 55px;
        height: 32px;
        border: 2px solid rgba(255, 255, 255, 0.6);
        border-radius: 20px;
        align-items: center;
        justify-content: center;
        font-size: 25px;
    }
    .file{
        position: absolute;
        right: 28px;
        top: 78px;
        font-size: 12px;
        /* opacity: 15; */
    }
    .content{
        position: absolute;
        left: 30px;
        top: 135px;
    }
    .content p{
        font-size: 20px;
        opacity: 0.65;
        margin-bottom: 10px;
    }
    .content h1{
        font-size: 45px;
        line-height: 1.05;
        font-weight: 500;
        max-width: 380px;
    }
    .design{
        display: flex;
        margin-top: 35px;
        width: 260px;
        height: 55px;
        align-items: center;
        justify-content: space-between;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        font-size: 18px;
        padding-left: 18px;
        padding-right: 8px;
    }
    .design-arrow{
        display: flex;
        width: 42px;
        height: 42px;
        border-radius: 50px;
        background: rgba(255, 255, 254, 0.15);
        align-items: center;
        justify-content: center;
        font-size: 20px;
    }
    .star{
        position: absolute;
        bottom: 30px;
        left: 30px;
        font-size: 38px;
    }
    .resolution{
        position: absolute;
        bottom: 38px;
        right: 28px;
        font-size: 12px;
        opacity: 0.75;
    }

</style>
<body>
    <div class="glass-card">
        
        <div class="arrow">
         <i class="fa-solid fa-arrow-right-long"></i>  
    </div>

    <div class="file">
        [Source Files]
    </div>

    <div class="content">
        <p>Style is intentional.</p>
        <h1>Refine your <br>
             visual until <br>
             they resonate
            </h1>
        
         <div class="design">
            DESIGN SPECS

            <div class="design-arrow">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </div>
         </div>
    </div>

    <div class="star">
        <i class="fa-solid fa-asterisk"></i>
    </div>

    <div class="resolution">
        [4K Resolution]
    </div>
    
    </div>
</body>
</html>
